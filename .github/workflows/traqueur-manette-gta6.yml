name: Traqueur manette GTA VI

on:
  schedule:
    # Sony (PlayStation) : toutes les 8 minutes (minutes 0, 8, 16, … 56).
    - cron: "*/8 * * * *"
    # Tout le reste (idealo, enseignes, Dealabs) + Sony + bilans : toutes les 30 minutes, calé entre
    # deux passages Sony. GitHub peut décaler les horaires de quelques minutes quand il est chargé.
    - cron: "4,34 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "verifier = recherche complète, sony = Sony seulement, essai = recherche sans notif ni sauvegarde, diagnostic = test des sites, test-notif = notif de test"
        required: true
        default: verifier
        type: choice
        options: [verifier, sony, essai, diagnostic, test-notif]
      filtre:
        description: "(diagnostic) ne tester que les sites dont le nom contient ce texte"
        required: false
        default: ""

permissions:
  contents: write   # pour enregistrer l'état et STATUT.md dans le repo
  issues: write     # pour les alertes / bilans par issue (= email + notif appli GitHub)

concurrency:
  group: traqueur-manette-gta6
  cancel-in-progress: false

jobs:
  traquer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Lancement manuel : le mode choisi. Planifié : "sony" pour le cron des 8 min, sinon recherche complète.
      MODE: ${{ inputs.mode || (github.event.schedule == '*/8 * * * *' && 'sony') || 'verifier' }}
    defaults:
      run:
        working-directory: traqueur-manette-gta6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: traqueur-manette-gta6/requirements.txt

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Lancer
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m traqueur "$MODE" "${{ inputs.filtre }}"

      - name: Enregistrer l'état
        if: ${{ env.MODE == 'verifier' || env.MODE == 'sony' }}
        run: |
          git config user.name "traqueur-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat STATUT.md
          if git diff --cached --quiet; then
            echo "Rien de nouveau à enregistrer."
            exit 0
          fi
          git commit -q -m "Traqueur : bilan du $(TZ=Europe/Paris date '+%d/%m %Hh%M')"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 5))
          done
          echo "Impossible d'enregistrer l'état après 4 essais" && exit 1
