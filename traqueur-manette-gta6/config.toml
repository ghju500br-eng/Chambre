# ─────────────────────────────────────────────────────────────────────────────
#  Réglages du traqueur de manette DualSense édition limitée GTA VI
#  Tu peux modifier ce fichier directement sur GitHub (icône crayon) : la
#  prochaine vérification prendra les nouveaux réglages en compte.
# ─────────────────────────────────────────────────────────────────────────────

[objectif]
# Alerte immédiate (notif urgente) si une offre fiable et commandable coûte MOINS que ça, port compris.
seuil_alerte = 100.0
# Notif "bon compromis" (moins urgente) entre le seuil d'alerte et ce montant, seulement pour
# Sony et les enseignes qui vendent elles-mêmes (pas les vendeurs tiers).
seuil_compromis = 110.0
# Éditions qui t'intéressent : "blanche", "noire" (ou les deux).
editions = ["blanche", "noire"]
# Accepter les manettes d'occasion ? (false = neuf uniquement)
accepter_occasion = false

[amazon]
# Amazon refuse les robots depuis les serveurs GitHub (captcha, vérifié le 20/11/2026) : on respecte
# et on ne l'interroge pas en direct. Ses prix remontent via idealo et Dealabs.
acces_direct = false
surveiller_europe = false
port_estime_europe = 7.0

[ebay]
# eBay refuse aussi les robots (erreur 403). Laisse à false. Les règles ci-dessous servent si un jour
# on passe par l'API officielle d'eBay.
acces_direct = false
note_min_pourcent = 98.0
nb_evaluations_min = 100
prix_min_credible = 55.0
pays_acceptes = ["France", "Belgique", "Allemagne", "Italie", "Espagne", "Pays-Bas", "Luxembourg",
                 "Autriche", "Portugal", "Irlande"]

[bilans]
# Petite notif silencieuse (sans son ni vibration) à chaque vérification complète (toutes les 30 min).
# (Les passages Sony toutes les 5 min n'envoient rien, sauf une alerte si la manette est dispo.)
bilan_horaire = true
# Récap complet chaque jour à cette heure (heure de Paris), en notif + commentaire GitHub.
heure_bilan_quotidien = 20

# ─────────────────────────────────────────────────────────────────────────────
#  Fiches surveillées (toutes vérifiées le 20/11/2026). Le traqueur cherche aussi
#  tout seul chez Micromania, Leclerc, Boulanger, Auchan, LDLC et sur Dealabs.
#  Pour en ajouter une : copie un bloc [[fiches]] et change l'URL.
# ─────────────────────────────────────────────────────────────────────────────

